name: .NET CI

# Manual trigger only for now.
# When ready to enable on every push/PR, uncomment the `push` and `pull_request` blocks below.
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run ECommerceApp.E2E.Backend (starts SQL Server containers, slower)'
        type: boolean
        default: false
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

env:
  DOTNET_VERSION: '7.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build, Test, ArchUnitNET
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ECommerceApp.sln

      - name: Build (Release, no restore)
        run: dotnet build ECommerceApp.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Unit tests
        run: >
          dotnet test ECommerceApp.UnitTests/ECommerceApp.UnitTests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults

      - name: Integration tests
        run: >
          dotnet test ECommerceApp.IntegrationTests/ECommerceApp.IntegrationTests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./TestResults

      # ArchUnitNET architecture tests live inside ECommerceApp.UnitTests/Architecture/
      # and run as part of the unit test suite above. No separate step needed.

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 14

  # E2E.Backend on real SQL Server (Testcontainers). Opt-in: workflow_dispatch with run_e2e=true.
  # To detach it, delete this job (and the run_e2e input); nothing else depends on it.
  # Test independence: no test may depend on another, and we do NOT enforce or randomize test order
  # (by design - the test framework is built so tests do not need a fixed order). The suite is fast,
  # so a scheduled random-order run is deferred; revisit it when the suite gets slow enough to hurt.
  # NOT YET RUN on a real runner - ubuntu-latest has Docker, but timing and memory are unmeasured.
  e2e-backend:
    name: E2E.Backend (SQL Server containers)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: E2E.Backend tests
        run: >
          dotnet test ECommerceApp.E2E.Backend/ECommerceApp.E2E.Backend.csproj
          --configuration ${{ env.CONFIGURATION }}

  # Knowledge-graph validation gate (plan 08, workstream C; ADR-0031).
  # NOT YET RUN on a real runner - first execution may need path / SDK tweaks.
  #
  # What this gate does:    kg-codegen --check parses the code and validates it against
  #                         tools/kg/seed/ontology.json. Exit code 1 == at least one `error:`.
  # What it does NOT do:    compare the output with the committed tools/kg/kg-seed.cypher,
  #                         so a stale seed still passes. Open decision, see roadmap O1.
  # Hard rules:             never write/commit a seed, never load Neo4j, and never gate on the
  #                         warning count (~209 warnings is the designed state).
  # Trigger:                when push/pull_request are enabled above, scope this job to
  #                         `**/*.cs` and `tools/kg/**` (path filters are workflow-level, so
  #                         split it into its own workflow first or build-and-test is narrowed too).
  kg-validation:
    name: KG - codegen check + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KG_DOTNET_VERSION: '10.0.x'   # tools/kg projects target net10.0 (the 7.0.x above is for ECommerceApp.sln)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (KG tools)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.KG_DOTNET_VERSION }}

      - name: Build KgCodegen
        run: dotnet build tools/kg/kg-codegen/KgCodegen.sln --configuration ${{ env.CONFIGURATION }}

      - name: KgCodegen tests
        run: dotnet test tools/kg/kg-codegen/KgCodegen.sln --configuration ${{ env.CONFIGURATION }} --no-build

      # Exit code is the signal; warnings are expected and must not fail the job.
      - name: kg-codegen --check
        run: dotnet run --project tools/kg/kg-codegen/KgCodegen --configuration ${{ env.CONFIGURATION }} -- --root . --check

      - name: Verify nothing under tools/kg was modified (tests + --check)
        run: |
          if [ -n "$(git status --porcelain -- tools/kg)" ]; then
            echo "::error::Files under tools/kg were modified by the KgCodegen tests or kg-codegen --check"
            git status --porcelain -- tools/kg
            exit 1
          fi

      - name: Build KgMcp
        run: dotnet build tools/kg/kg-mcp/KgMcp.sln --configuration ${{ env.CONFIGURATION }}

      # Decision: Testcontainers.Neo4j suites need Docker and run locally only, not here.
      # If they should gate CI, drop the filter (ubuntu-latest does ship Docker) and update roadmap O1.
      - name: KgMcp tests (without Testcontainers suites)
        run: >
          dotnet test tools/kg/kg-mcp/KgMcp.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --filter "FullyQualifiedName!~GraphServiceTests&FullyQualifiedName!~RealGraphE2ETests"

  # GO gate hook tests (ADR-0033). Pure Node, no dotnet; independent of the other jobs.
  # Hooks use only node: built-ins and ESM, so any current LTS works; no package.json/engines pin exists.
  # Trigger: when push/pull_request are enabled above, scope this job to `tools/hooks/**`,
  # `.claude/hooks/**` and `.github/hooks/**` (path filters are workflow-level, so split it into its own workflow first).
  hook-tests:
    name: GO gate hook tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hook tests
        run: >
          node --test
          tools/hooks/gate-core.test.mjs
          .claude/hooks/go-gate-adapter.test.mjs
          .github/hooks/go-gate-adapter.test.mjs
